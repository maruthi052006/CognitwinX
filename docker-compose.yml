version: '3.8'

services:
  # PostgreSQL with PostGIS extension
  postgres:
    image: postgis/postgis:15-3.3
    container_name: cognitwin_postgis
    environment:
      POSTGRES_DB: cognitwin_db
      POSTGRES_USER: cognitwin_user
      POSTGRES_PASSWORD: cognitwin_password
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognitwin_user -d cognitwin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Celery Broker and Channels Layer
  redis:
    image: redis:7-alpine
    container_name: cognitwin_redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend: Django Channels Daphne Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognitwin_backend
    command: >
      sh -c "python manage.py makemigrations users digital_twin alerts chat_router_agent &&
             python manage.py migrate &&
             python manage.py seed_twin_data &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - USE_POSTGIS=True
      - DB_ENGINE=django.contrib.gis.db.backends.postgis
      - DB_NAME=cognitwin_db
      - DB_USER=cognitwin_user
      - DB_PASSWORD=cognitwin_password
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS_CHANNELS=True
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # Multi-Agent Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognitwin_celery_worker
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
      - media_data:/app/media
    environment:
      - DJANGO_DEBUG=True
      - USE_POSTGIS=True
      - DB_ENGINE=django.contrib.gis.db.backends.postgis
      - DB_NAME=cognitwin_db
      - DB_USER=cognitwin_user
      - DB_PASSWORD=cognitwin_password
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - backend
      - redis
    restart: always

  # Scheduled Cognitive Cycles (Celery Beat)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognitwin_celery_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_DEBUG=True
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - celery_worker
      - redis
    restart: always

  # Frontend: Nginx Production Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cognitwin_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgis_data:
  media_data:
  static_data:
